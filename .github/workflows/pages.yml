name: Publish GitHub Pages

on:
  workflow_run:
    workflows: [Web gallery]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publications, including manual retries; never interrupt a deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      # Select a tested artifact from this repository's master branch. Never
      # execute code from the build artifact in this privileged workflow.
      - name: Select latest successful Web gallery build
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'web.yml', branch: 'master',
              status: 'success', per_page: 100
            });
            const run = result.data.workflow_runs.find(run =>
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.head_repository?.full_name === `${owner}/${repo}`);
            if (!run) throw new Error('No successful master Web gallery build is available.');
            core.setOutput('run_id', String(run.id));
            await core.summary.addLink('Published build', run.html_url)
              .addRaw(` (commit ${run.head_sha})`).write();
      - name: Download tested website
        uses: actions/download-artifact@v4
        with:
          name: dasrmlui-web
          path: site
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested gallery
        id: deployment
        uses: actions/deploy-pages@v4
